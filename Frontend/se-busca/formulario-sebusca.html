       </nav>

   <script src="js/formulario.js"></script>


   <!--FIN BARRA NAVEGACIÓN-->


   <main>
 <div class="padre">

   <div class="formulario">
       <div class="columna-formulario">


           <div class="formulario-sin-encabezado">
           <div class="info-formulario">


               <!-- FORMULARIO REAL -->
               <form id="alta_pet" enctype="multipart/form-data">


                   <div class="caja-titulo">¡Rellena este formulario!</div>


                  
                       <label>Especie</label>
                       <select name="tipo" id="tipo">
                           <option value="">Selecciona</option>
                           <option value="Perro">Perro</option>
                           <option value="Gato">Gato</option>
                           <option value="Otros">Otros</option>
                       </select>
                  


                  
                       <label>Nombre del animal</label>
                       <input type="text" name="nombre" id="nombre" autocomplete="off">
                  


                  
                       <label>Raza</label>
                       <input type="text" name="raza" id="raza" autocomplete="off">
                  


                  
                       <label>Edad</label>
                       <input type="text" name="edad" id="edad" placeholder="1" autocomplete="off">
                  


                  
                       <label>Comportamiento</label>
                       <textarea cols="22" rows="3"
                                 name="comportamiento" id="comportamiento"
                                 placeholder="..." autocomplete="off"></textarea>
                  


                  
                       <label>Vacunas</label>
                       <select name="vacunas" id="vacunas">
                           <option value="">¿Vacunado?</option>
                           <option value="Sí">Sí</option>
                           <option value="No">No</option>
                       </select>
                  


                  
                       <label>Sexo</label>
                       <select name="sexo" id="sexo">
                           <option value="">Sexo</option>
                           <option value="Macho">Macho</option>
                           <option value="Hembra">Hembra</option>
                       </select>
                  


                  
                       <label>Foto</label>
                       <input type="file" name="file" id="files" multiple>
                  
                   <div class="caja-titulo">Datos del propietario</div>
                  


                  
                       <label>Nombre del dueño</label>
                       <input type="text" name="nombreDueno" id="nombreDueno">
                  


                  
                       <label>Email</label>
                       <input type="email" name="email" id="email">
                  


                  
                       <label>Teléfono</label>
                       <input type="text" name="telefono" id="telefono">
                  




                       <button id="upload-button" type="submit">
                           <label>ENVIAR</label>
                       </button>


                       <button id="cancel-edit" type="button"
                               style="display:none; margin-left:8px;">
                           Cancelar edición
                       </button>
               </form>
           </div>
           </div>
           </div>
           </div>
 </div>
